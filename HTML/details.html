<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Movie information and cinema showtimes on Cinevia.">
    <title>Movie Details - Cinevia</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <a href="index.html" class="logo">Cinevia</a>
        <a href="listing.html">← All movies</a>
        <a href="auth.html">Account</a>
    </header>

    <main class="container">
        <section class="detail-top">
            <img id="moviePoster" src="../Pics/toxic.jpeg" alt="Movie poster">
            <div class="detail-info">
                <p class="filter-title" id="movieStatus">NOW SHOWING</p>
                <h1 class="detail-title" id="movieTitle">Loading movie…</h1>
                <p class="tagline" id="movieTagline"></p>
                <div id="movieTags" aria-label="Movie information"></div>
                <p class="synopsis" id="movieSynopsis"></p>
                <h2 class="heading" style="font-size:18px;">Cast</h2>
                <div class="cast-list" id="movieCast"></div>
            </div>
        </section>

        <section aria-labelledby="showtimesHeading">
            <h2 class="heading" id="showtimesHeading">Choose a cinema and showtime</h2>
            <p id="showtimeNotice" class="synopsis" aria-live="polite"></p>
            <div class="cinema-card" data-screen="Screen 1">
                <div class="cinema-name">PVR Rajouri Garden</div>
                <div class="cinema-address">Rajouri Garden, New Delhi</div>
                <button type="button" class="showtime-btn">10:15 AM</button>
                <button type="button" class="showtime-btn">1:30 PM</button>
                <button type="button" class="showtime-btn">4:45 PM</button>
                <button type="button" class="showtime-btn">8:00 PM</button>
            </div>
            <div class="cinema-card" data-screen="Screen 2">
                <div class="cinema-name">INOX Nehru Place</div>
                <div class="cinema-address">Nehru Place, New Delhi</div>
                <button type="button" class="showtime-btn">11:00 AM</button>
                <button type="button" class="showtime-btn">2:20 PM</button>
                <button type="button" class="showtime-btn">6:10 PM</button>
            </div>
        </section>

        <section class="trailer-section">
            <h2 class="heading">Trailer</h2>
            <div class="trailer-box">
                <p>Trailer information will be added when available.</p>
            </div>
        </section>
    </main>

    <script src="../js/movie-data.js"></script>
    <script src="../js/details.js"></script>
</body>
</html>
