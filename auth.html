<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieHub - Account Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            🎬 <span>Movie</span>Hub
        </div>
        <a href="index.html" class="back-home">← Back to Home</a>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="tab-buttons">
                <button class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="auth-form active" onsubmit="event.preventDefault(); window.location.href='booking.html';">
                <h2>Welcome Back 👋</h2>
                <p class="subtitle">Enter your credentials to manage bookings & rewards.</p>

                <div class="input-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="alex@example.com" required>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePass('loginPassword')">👁️</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me"><input type="checkbox"> Remember me</label>
                    <a href="#" class="forgot-pass">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Login to Account</button>

                <div class="divider"><span>OR CONTINUE WITH</span></div>

                <div class="social-login">
                    <button type="button" class="social-btn">🌐 Google</button>
                    <button type="button" class="social-btn">🍎 Apple</button>
                </div>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="auth-form" onsubmit="event.preventDefault(); window.location.href='booking.html';">
                <h2>Create Account ✨</h2>
                <p class="subtitle">Join MovieHub for instant seat locking and zero booking fees.</p>

                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Alex Johnson" required>
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="alex@example.com" required>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signupPassword" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePass('signupPassword')">👁️</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Create Free Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');

            if (tab === 'login') {
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
            } else {
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
            }
        }

        function togglePass(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
